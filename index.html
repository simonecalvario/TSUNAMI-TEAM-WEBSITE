<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TSUNAMI TEAM | Friendship is liquid</title>

  <meta name="description" content="TSUNAMI TEAM — Friendship is liquid. A community built on freedom, friendship, adaptability and shared experiences.">

  <meta name="theme-color" content="#101010">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --black: #101010;
      --dark: #181818;
      --yellow: #f5d21b;
      --orange: #ff7a18;
      --white: #f5f5f5;
      --grey: #b7b7b7;
      --line: rgba(255,255,255,0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body { background: var(--black); color: var(--white); font-family: Arial, Helvetica, sans-serif; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1100px, 90%); margin: 0 auto; }

    header { position: sticky; top: 0; z-index: 10; background: rgba(16,16,16,0.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    nav { min-height: 72px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { color: var(--yellow); font-weight: 900; letter-spacing: 2px; font-size: 1rem; white-space: nowrap; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 18px; font-size: 0.85rem; }
    .nav-links a:hover { color: var(--yellow); }

    /* existing styles omitted for brevity, kept as before */

    section { padding: 90px 0; border-top: 1px solid var(--line); }
    .section-label { color: var(--orange); font-size: 0.8rem; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
    h2 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.15; margin-bottom: 25px; letter-spacing: -1px; }
    h2 span { color: var(--yellow); }
    .intro { max-width: 760px; color: var(--grey); font-size: 1.1rem; }

    /* Meetings map styles */
    #meetings { padding: 80px 0; background: linear-gradient(135deg, rgba(245,210,27,0.08), transparent 55%); }
    #world-map { width: 100%; height: 520px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: #0b0b0b; }

    /* Custom pin styling using divIcon + img */
    .custom-pin { display: block; line-height: 0; }
    .custom-pin img { display:block; width: 40px; height: auto; transform-origin: 50% 100%; transition: transform 180ms ease, width 180ms ease; -webkit-user-drag: none; }
    .custom-pin.enlarged img { transform: scale(2.4); }

    /* When marker is scaled by zoom we'll modify inline width; this keeps aspect ratio intact */

    .meetings-popup .leaflet-popup-content-wrapper, .meetings-popup .leaflet-popup-content { border-radius: 12px; background: #101010; color: #fff; }
    .meetings-popup a { color: #101010; }

    @media (max-width: 700px) { #world-map { height: 360px; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a class="brand" href="#home">TSUNAMI TEAM</a>
        <div class="nav-links">
          <a href="#philosophy">Philosophy</a>
          <a href="#experiences">Experiences</a>
          <a href="#founders">Founders</a>
          <a href="#meetings">Meetings</a>
          <a href="#statute">Our Statute</a>
          <a href="#join">Join Us</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <!-- other sections omitted for brevity -->

    <!-- TSUNAMI MEETINGS -->
    <section id="meetings" aria-labelledby="meetings-heading">
      <div class="container">
        <div class="section-label">Meetings</div>
        <h2 id="meetings-heading">Tsunami <span>Meetings</span></h2>
        <p class="intro">Map of our meetings: click the pins to explore the gallery of each trip.</p>
        <div id="world-map"></div>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <strong>TSUNAMI TEAM</strong>
      <p>Friendship is liquid.</p>
      <p>Freedom, friendship and shared experiences.</p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      // City markers and icon asset paths
      const cities = [
        { id: 'barcelona', name: 'Barcelona', coords: [41.3851, 2.1734], url: '/barcelona.html', icon: 'assets/images/pins/assets/images/pins/assets/images/pins/Barcelona.png.JPG' },
        { id: 'doha',      name: 'Doha',      coords: [25.2854, 51.5310], url: '/doha.html',      icon: 'assets/images/pins/assets/images/pins/assets/images/pins/Doha.png.PNG' },
        { id: 'munich',    name: 'Munich',    coords: [48.1351, 11.5820], url: '/munich.html',    icon: 'assets/images/pins/assets/images/pins/assets/images/pins/Munich.png.PNG' }
      ];

      const initialZoom = 3;
      const baseSize = 40; // px at initial zoom

      const map = L.map('world-map', { zoomControl: true }).setView([38, 14], initialZoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Helper to compute size based on zoom; adjust curve to taste
      function sizeForZoom(zoom) {
        // exponential scaling so pins grow smoothly with zoom
        return Math.round(baseSize * Math.pow(1.18, zoom - initialZoom));
      }

      // Create a divIcon that holds an <img>
      function createDivIcon(url, size) {
        return L.divIcon({
          className: 'custom-pin',
          html: `<img src="${url}" alt="" draggable="false" />`,
          iconSize: [size, size],
          iconAnchor: [Math.round(size/2), size]
        });
      }

      const markers = [];

      // Add markers
      cities.forEach(city => {
        const initialSize = sizeForZoom(map.getZoom());
        const marker = L.marker(city.coords, { icon: createDivIcon(city.icon, initialSize), keyboard: true }).addTo(map);

        // popup with gallery link
        const popupHtml = `
          <div style="text-align:center; min-width:170px;">
            <strong style="display:block; margin-bottom:8px;">${city.name}</strong>
            <a href="${city.url}" style="display:inline-block; margin-top:6px; padding:8px 12px; background:#f5d21b; color:#101010; border-radius:6px; font-weight:700; text-decoration:none;">Go to the Gallery</a>
          </div>
        `;
        marker.bindPopup(popupHtml, { closeButton: true, className: 'meetings-popup' });

        // keep reference
        markers.push({ marker, city });

        // enlarge on click: open popup and add enlarged class
        marker.on('click', function () {
          marker.openPopup();
          const el = marker.getElement();
          if (el) {
            el.classList.add('enlarged');
            // remove enlarged after a while (popupopen will also keep it if needed)
            setTimeout(() => { if (el) el.classList.remove('enlarged'); }, 800);
          }
        });

        marker.on('popupopen', function () {
          const el = marker.getElement(); if (el) el.classList.add('enlarged');
        });
        marker.on('popupclose', function () {
          const el = marker.getElement(); if (el) el.classList.remove('enlarged');
        });
      });

      // Update marker sizes when map zooms
      function updateMarkerSizes() {
        const z = map.getZoom();
        const newSize = sizeForZoom(z);
        markers.forEach(({ marker }) => {
          const el = marker.getElement();
          if (!el) return;
          const img = el.querySelector('img');
          if (img) {
            img.style.width = newSize + 'px';
            // update iconAnchor for accurate pointing: Leaflet doesn't expose direct API to change anchor
            // but we can reset the marker icon to a new divIcon so leaflets internal layout updates
            const cityObj = markers.find(m => m.marker === marker).city;
            marker.setIcon(createDivIcon(cityObj.icon, newSize));
          }
        });
      }

      map.on('zoomend', updateMarkerSizes);

      // initial sizing
      setTimeout(updateMarkerSizes, 300);

      // keyboard accessibility
      setTimeout(() => {
        document.querySelectorAll('.custom-pin').forEach(el => {
          el.setAttribute('tabindex', '0');
          el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') el.click(); });
        });
      }, 600);

    })();
  </script>

  <script>
    window.addEventListener('load', function () {
      if (!location.hash) {
        const home = document.getElementById('home');
        if (home) home.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    });
  </script>
</body>
</html>
