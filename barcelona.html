<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barcelona — Gallery</title>
  <style>
    body {
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      padding: 28px;
      line-height: 1.7;
    }
    a.back {
      color: #f5d21b;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 28px;
    }
    .grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Torna al sito</a>
  <h1>Barcelona — Photo &amp; Video Gallery</h1>
  <p>Qui inserisci foto e video del viaggio a Barcelona.</p>

  <div class="grid">
    <img src="assets/images/pins/barcelona.png" alt="Barcelona pin placeholder">
    <img src="assets/images/pins/barcelona.png" alt="Barcelona placeholder image 2">
    <img src="assets/images/pins/barcelona.png" alt="Barcelona placeholder image 3">
  </div>
</body>
</html>
