name: Deploy API Worker

# Publishes worker/ to Cloudflare. Needs three repository secrets
# (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID
#   SUPABASE_JWT_SECRET    Supabase → Project Settings → JWT Keys → Legacy JWT secret
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: SUPABASE_JWT_SECRET
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
